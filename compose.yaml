# tuesday num servidor, com PostgreSQL.
#
#   cp .env.example .env      # senha do banco e endereço do servidor
#   docker compose up -d
#
# Depois abra http://<servidor>:4010 e crie a primeira conta — ela administra a instalação.
services:
  tuesday:
    image: ghcr.io/matheusbvieira/tuesday:latest
    build: .
    restart: unless-stopped
    ports:
      - '${TUESDAY_PORT:-4010}:4010'
    environment:
      TUESDAY_DATABASE_URL: postgres://tuesday:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/tuesday
      # Só com domínio/proxy na frente (e para o login com o Google). Acessando direto pelo IP da máquina,
      # pode deixar vazio: o servidor confia no endereço por onde foi aberto.
      TUESDAY_URL: ${TUESDAY_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Atrás de um proxy com HTTPS (nginx, Caddy, Traefik), para o limite de tentativas usar o IP real:
      # TUESDAY_TRUST_PROXY: '1'
    labels:
      # Marca quem o watchtower (abaixo) pode atualizar — o PostgreSQL fica de fora de propósito.
      com.centurylinklabs.watchtower.enable: 'true'
    # Pastas de código para os commits ligados aos itens e os TODOs: monte aqui e vincule os projetos a /repos/...
    # volumes:
    #   - /srv/codigo:/repos:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tuesday
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: tuesday
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tuesday']
      interval: 5s
      timeout: 5s
      retries: 20

  # Atualização automática (opcional):  docker compose --profile auto up -d
  # Toda madrugada ele confere se saiu imagem nova do tuesday, baixa e recria o contêiner. As migrações do banco
  # rodam sozinhas na subida. Precisa do socket do Docker: quem manda nele manda no servidor, então só ligue se
  # confia em quem tem acesso à máquina. Trocando ":latest" por ":1" na imagem acima, ele fica dentro da major.
  watchtower:
    profiles: ['auto']
    image: containrrr/watchtower:latest
    restart: unless-stopped
    command: --label-enable --cleanup --schedule "0 0 4 * * *"
    environment:
      # O watchtower 1.7.1 conversa com o Docker numa versão de API que os daemons novos recusam; isto resolve.
      DOCKER_API_VERSION: '1.41'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres:
